name: Release notes - fork check (temporary, delete before merging)

# A one-off live check of publish-release-branch.sh with the real BOT_PAT and BOT_FORK_PAT: it opens a
# throwaway draft PR in docs-website from the bot's fork, edits the fork branch, checks the PR follows,
# then closes the PR and deletes the branch.

on:
  push:
    branches: [release-notes-fork]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCS_REPO: newrelic/docs-website
      FORK: newrelic-mobile-agents-bot/docs-website
      BRANCH: release-notes-fork-check-${{ github.run_id }}
      DOCS_DIR: release-notes-fork-check
      FILE: check-${{ github.run_id }}.mdx
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Publish a throwaway note from the fork
        id: publish
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          BOT_PAT: ${{ secrets.BOT_PAT }}
          FORK_PAT: ${{ secrets.BOT_FORK_PAT }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
        run: |
          set -euo pipefail
          printf 'release-notes fork check, run %s; safe to delete\n' "$RUN_ID" > "$RUNNER_TEMP/check.mdx"
          printf 'Test of the release-notes fork setup (newrelic/newrelic-android-agent run %s); it closes itself.\n' \
            "$RUN_ID" > "$RUNNER_TEMP/body.md"
          gh auth setup-git
          .github/actions/release-notes/scripts/publish-release-branch.sh --docs-repo "$DOCS_REPO" --docs-base develop \
            --docs-dir "$DOCS_DIR" --file "$FILE" --source "$RUNNER_TEMP/check.mdx" --branch "$BRANCH" \
            --subject "TEST: release-notes fork check, please ignore -" --version "$RUN_ID" \
            --body-file "$RUNNER_TEMP/body.md" | tee "$RUNNER_TEMP/publish.out"
          url=$(sed -n 's/^opened //p' "$RUNNER_TEMP/publish.out")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Check the PR is from the fork and follows an edit there
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          FORK_PAT: ${{ secrets.BOT_FORK_PAT }}
          NUMBER: ${{ steps.publish.outputs.number }}
        run: |
          set -euo pipefail
          view() { gh pr view "$NUMBER" --repo "$DOCS_REPO" --json headRepositoryOwner,isDraft,headRefOid,maintainerCanModify; }
          view | tee "$RUNNER_TEMP/before.json"
          [ "$(jq -r .headRepositoryOwner.login "$RUNNER_TEMP/before.json")" = newrelic-mobile-agents-bot ]
          [ "$(jq -r .isDraft "$RUNNER_TEMP/before.json")" = true ]
          # An edit on the fork branch, as a collaborator makes one.
          sha=$(GH_TOKEN=$FORK_PAT gh api "repos/$FORK/contents/$DOCS_DIR/$FILE?ref=$BRANCH" --jq .sha)
          GH_TOKEN=$FORK_PAT gh api -X PUT "repos/$FORK/contents/$DOCS_DIR/$FILE" -f message="test: an edit on the fork" \
            -f content="$(printf 'edited on the fork\n' | base64)" -f sha="$sha" -f branch="$BRANCH" --silent
          new=$(GH_TOKEN=$FORK_PAT gh api "repos/$FORK/branches/$BRANCH" --jq .commit.sha)
          for _ in $(seq 1 30); do
            [ "$(view | jq -r .headRefOid)" = "$new" ] && { echo "The PR follows the fork branch ($new)."; exit 0; }
            sleep 2
          done
          echo "::error::The PR did not pick up the edit on the fork within a minute"
          exit 1

      - name: Close the PR and delete the branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          FORK_PAT: ${{ secrets.BOT_FORK_PAT }}
          NUMBER: ${{ steps.publish.outputs.number }}
        run: |
          set -uo pipefail
          if [ -n "$NUMBER" ]; then
            gh pr close "$NUMBER" --repo "$DOCS_REPO" --comment "Test of the release-notes fork setup; closing."
          fi
          GH_TOKEN=$FORK_PAT gh api -X DELETE "repos/$FORK/git/refs/heads/$BRANCH" --silent ||
            echo "::warning::Could not delete $BRANCH on $FORK"
