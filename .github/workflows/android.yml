name: Android CI

on:
  push:
    branches: [ "develop", "main", "feature/*" ]
  pull_request:
    branches: [ "develop", "main" ]

  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (defaults to event ref)'
        required: false
        default: ''
        type: string

  workflow_dispatch:
    inputs:
    #  working-branch:
    #    description: 'TBA: Build this branch (default is current)'
    #    required: false
    #    default: ${{ env.GITHUB_REF_NAME }}
    #    type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: set up JDK 11
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: current
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        id: build-step
        run: ./gradlew build
      - name: Upload build reports
        if: failure() && steps.build-step.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            agent/build/reports/tests/test/
            agent-core/build/reports/tests/test/
            instrumentation/gradle/build/reports/tests/test/
            plugins/gradle/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7
