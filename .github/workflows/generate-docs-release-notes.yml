name: Generate docs release notes

# When an Android agent release is published, build the final release-notes .mdx from
#   A) the bullets accumulated on docs-website's android-next branch, and
#   B) every PR merged between the previous release tag and this one (GitHub's generated notes),
# reconcile them (a PR in both appears once), and open a DRAFT PR on newrelic/docs-website.
# A human must edit that PR before it merges. This replaces the CHANGELOG.md pass the original
# ticket assumed; release-please was reverted in #638, so there is no CHANGELOG.md to read.
#
# Re-running for a version never destroys a person's edits: if the release-notes branch already
# exists with different content the run stops, unless it is dispatched with overwrite=true.
#
# Requires repo secrets BOT_PAT (contents:write + pull-requests:write on newrelic/docs-website)
# and BOT_EMAIL.
#
# Operational notes:
# - A `release` event runs this file as it is at the tagged commit, so it must exist on the branch the
#   release is tagged from (main or release/*) before the first release that should use it.
#   workflow_dispatch appears in the Actions UI only once the file is on the default branch.
# - A release published by GITHUB_TOKEN does not trigger workflows. Today a bot creates a draft and a
#   person publishes it, which does. If publishing is ever automated (release-please, PR #642), use a PAT.
# - GitHub keeps one pending run per concurrency group, so a burst of merges can in rare cases replace
#   a queued run (shown as cancelled). If that happens to a release run, dispatch it again.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build notes for, e.g. 7.8.4 (the tag must exist)"
        required: true
      overwrite:
        description: "Replace an existing release-notes branch or file for this version (discards edits made on it)"
        type: boolean
        default: false

permissions:
  contents: write # POST /releases/generate-notes needs push access

env:
  # Repo variable DOCS_REPO overrides this, which is how the workflows are tested against a fork.
  DOCS_REPO: ${{ vars.DOCS_REPO || 'newrelic/docs-website' }}
  DOCS_BASE: develop
  DOCS_HEAD: android-next
  DOCS_DIR: src/content/docs/release-notes/mobile-release-notes/android-release-notes
  DOCS_FILE_NAME: android-agent-next.mdx
  DOWNLOAD_LINK: https://central.sonatype.com/artifact/com.newrelic.agent.android/android-agent

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    # Shares its group with append-docs-release-notes.yml so a release never races a bullet push.
    concurrency:
      group: docs-release-notes-next
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scripts, skeleton and tags
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false # nothing here needs the token in .git/config; it would also shadow the credential helper

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$RELEASE_TAG}"
          version="${version#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if ! git rev-parse -q --verify "refs/tags/$version^{commit}" > /dev/null; then
              echo "::error::Tag $version does not exist in this repository."
              exit 1
            fi
            released_on="${PUBLISHED_AT%%T*}"
            [ -n "$released_on" ] || released_on=$(date -u +%F)
            {
              echo "valid=true"
              echo "version=$version"
              echo "slug=${version//./}"
              echo "dashed=${version//./-}"
              echo "released_on=$released_on"
            } >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "::error::'$version' is not an X.Y.Z release version."
            exit 1
          else
            echo "::notice::'$version' is not an X.Y.Z release; nothing to do."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight secrets
        if: steps.version.outputs.valid == 'true'
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
        run: |
          missing=""
          [ -n "$BOT_PAT" ] || missing="$missing BOT_PAT"
          [ -n "$BOT_EMAIL" ] || missing="$missing BOT_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see .github/workflows/generate-docs-release-notes.yml)"
            exit 1
          fi

      # Every command in this step talks to docs-website, so it is the only place (with the two
      # steps after it) that sees BOT_PAT. The step that handles PR text below does not.
      - name: Fetch the accumulated bullets and docs-website
        if: steps.version.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          SLUG: ${{ steps.version.outputs.slug }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          gh auth setup-git
          # Source A: bullets accumulated on docs-website (or a fresh skeleton). Only "no such branch"
          # (git ls-remote exit 2) means start from the skeleton; any other failure (network, 5xx,
          # auth) must stop the run, not silently drop the accumulated bullets.
          rc=0
          git ls-remote --exit-code --heads "https://github.com/$DOCS_REPO.git" "$DOCS_HEAD" > /dev/null 2>&1 || rc=$?
          case "$rc" in 0 | 2) ;; *) echo "::error::Could not check for $DOCS_HEAD on $DOCS_REPO (git ls-remote exit $rc)"; exit 1 ;; esac
          if [ "$rc" = 0 ]; then
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$DOCS_REPO/contents/$DOCS_DIR/$DOCS_FILE_NAME?ref=$DOCS_HEAD" > "$RUNNER_TEMP/next.mdx"
          else
            cp android-agent-next.mdx "$RUNNER_TEMP/next.mdx"
          fi
          gh repo clone "$DOCS_REPO" docs-website -- --depth 1 --branch "$DOCS_BASE"
          mkdir -p "docs-website/$DOCS_DIR"
          # A note for this version that is already on docs-website's base branch must not be replaced silently.
          if [ -e "docs-website/$DOCS_DIR/android-$SLUG.mdx" ] && [ "$OVERWRITE" != true ]; then
            echo "::error::android-$SLUG.mdx already exists on $DOCS_REPO $DOCS_BASE. Re-run with overwrite=true to replace it."
            exit 1
          fi

      - name: Build the release note
        if: steps.version.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }} # deliberately not BOT_PAT: this step runs the scripts that read PR text
          VERSION: ${{ steps.version.outputs.version }}
          SLUG: ${{ steps.version.outputs.slug }}
          RELEASED_ON: ${{ steps.version.outputs.released_on }}
        run: |
          set -euo pipefail
          S=.github/scripts

          prev=$(git tag --list | "$S/previous-tag.sh" "$VERSION")
          # An empty base would make generate-notes list a different set of PRs without any error.
          [ -n "$prev" ] || { echo "::error::No previous release tag found below $VERSION"; exit 1; }
          echo "Release $VERSION, previous release $prev"

          # Source B: PRs merged between the two tags.
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$VERSION" -f previous_tag_name="$prev" --jq .body > "$RUNNER_TEMP/generated-notes.txt"
          prs=$("$S/extract-pr-numbers.sh" < "$RUNNER_TEMP/generated-notes.txt" | tr '\n' ' ')
          [ -n "$prs" ] || { echo "::error::No PRs found between $prev and $VERSION"; exit 1; }
          echo "PRs in release: $prs"

          # Build a bullet for every release PR that has none yet (fork PRs, or any the per-PR run
          # missed). A PR that fails is listed in the docs PR description rather than dropped quietly.
          next="$RUNNER_TEMP/next.mdx"
          : > "$RUNNER_TEMP/failed-prs.txt"
          for pr in $prs; do
            "$S/process-pr.sh" "$pr" "$next" || {
              echo "::warning::Could not build a bullet for PR #$pr"
              echo "#$pr" >> "$RUNNER_TEMP/failed-prs.txt"
            }
          done

          # Keep only this release's bullets, then generate the final file.
          # shellcheck disable=SC2086 # $prs is a space-separated list of PR numbers
          "$S/filter-bullets.sh" "$next" keep $prs > "$RUNNER_TEMP/release-src.mdx"
          "$S/generate-docs.sh" --next "$RUNNER_TEMP/release-src.mdx" --version "$VERSION" \
            --date "$RELEASED_ON" --download-link "$DOWNLOAD_LINK" \
            --out "docs-website/$DOCS_DIR/android-$SLUG.mdx" --flags-out "$RUNNER_TEMP/flags.txt"

          printf '%s\n' "$prs" > "$RUNNER_TEMP/release-prs.txt"
          cat "docs-website/$DOCS_DIR/android-$SLUG.mdx"

      - name: Open or update the docs-website PR
        if: steps.version.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          VERSION: ${{ steps.version.outputs.version }}
          SLUG: ${{ steps.version.outputs.slug }}
          BRANCH: android_release_notes_${{ steps.version.outputs.dashed }}
          OVERWRITE: ${{ inputs.overwrite }}
        working-directory: docs-website
        run: |
          set -euo pipefail
          file="$DOCS_DIR/android-$SLUG.mdx"
          git config user.name "newrelic-mobile-agent-bot"
          git config user.email "$BOT_EMAIL"

          # Never overwrite a release-notes branch a person may have edited: the docs PR is where the
          # mandatory edit pass happens. Identical content is simply reused (safe re-run after a
          # half-finished run); different content stops the run unless overwrite=true.
          commit_and_push() { # push-args...
            git checkout -b "$BRANCH"
            git add "$file"
            git commit -m "docs: add Android agent $VERSION release notes"
            git push "$@" origin "HEAD:refs/heads/$BRANCH"
          }
          rc=0
          git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1 || rc=$?
          case "$rc" in
            2) commit_and_push ;;
            0)
              git fetch --depth 1 origin "$BRANCH"
              if git show "FETCH_HEAD:$file" 2> /dev/null | cmp -s - "$file"; then
                echo "$BRANCH already holds identical notes; reusing it."
              elif [ "$OVERWRITE" = true ]; then
                commit_and_push --force
              else
                echo "::error::$BRANCH already exists on $DOCS_REPO with different content (it may hold edits by a person). Delete the branch and its PR to regenerate, or dispatch this workflow with overwrite=true to discard them."
                exit 1
              fi
              ;;
            *) echo "::error::Could not check for $BRANCH on $DOCS_REPO (git ls-remote exit $rc)"; exit 1 ;;
          esac

          {
            echo "Release notes for **Android agent $VERSION**, generated from the PRs merged since the previous release."
            echo
            echo "**A human edit pass is required before this merges.** Bullets were generated from each PR's title, its \`release-note:*\` label and any \`Release note\` text in its description; titles are developer-facing, so most bullets need rewording."
            echo
            echo "Check: every bullet is user-facing and specific, bug bullets say what was broken, each bullet sits in the right section, and the frontmatter arrays mirror the body."
            if [ -s "$RUNNER_TEMP/flags.txt" ]; then
              echo
              echo "### Bullets that need extra attention"
              while read -r pr flag; do
                case "$flag" in
                  unlabelled) echo "- $pr had no \`release-note:*\` label; the section was guessed from the PR title." ;;
                  conflicting-labels) echo "- $pr had more than one \`release-note:*\` label; the section was guessed from the PR title." ;;
                  *) echo "- $pr: $flag" ;;
                esac
              done < "$RUNNER_TEMP/flags.txt"
            fi
            if [ -s "$RUNNER_TEMP/failed-prs.txt" ]; then
              echo
              echo "### Missing bullets"
              echo "A bullet could not be built for these PRs. Add them by hand if they are user-facing:"
              sed 's/^/- /' "$RUNNER_TEMP/failed-prs.txt"
            fi
            echo
            echo "Generated by newrelic/newrelic-android-agent .github/workflows/generate-docs-release-notes.yml (NR-620058)."
          } > "$RUNNER_TEMP/pr-body.txt"

          existing=$(gh pr list --repo "$DOCS_REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$DOCS_REPO" --body-file "$RUNNER_TEMP/pr-body.txt"
          else
            gh pr create --repo "$DOCS_REPO" --base "$DOCS_BASE" --head "$BRANCH" --draft \
              --title "Android agent $VERSION release notes" --label documentation \
              --body-file "$RUNNER_TEMP/pr-body.txt"
          fi

      - name: Remove released bullets from the next branch
        if: steps.version.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rc=0
          git ls-remote --exit-code --heads "https://github.com/$DOCS_REPO.git" "$DOCS_HEAD" > /dev/null 2>&1 || rc=$?
          case "$rc" in
            0) ;;
            2) echo "No $DOCS_HEAD branch; nothing to prune."; exit 0 ;;
            *) echo "::error::Could not check for $DOCS_HEAD on $DOCS_REPO (git ls-remote exit $rc)"; exit 1 ;;
          esac
          rm -rf docs-next
          gh repo clone "$DOCS_REPO" docs-next -- --depth 50 --branch "$DOCS_HEAD"
          file="docs-next/$DOCS_DIR/$DOCS_FILE_NAME"
          # Bullets for PRs outside this release (merged after the tag) stay for the next one.
          # shellcheck disable=SC2046
          .github/scripts/filter-bullets.sh "$file" drop $(cat "$RUNNER_TEMP/release-prs.txt") > "$RUNNER_TEMP/leftover.mdx"
          cd docs-next
          draft=$(gh pr list --repo "$DOCS_REPO" --head "$DOCS_HEAD" --state open --json number --jq '.[0].number // empty')
          if [ "$(grep -c '^\* ' "$RUNNER_TEMP/leftover.mdx" || true)" = "0" ]; then
            if [ -n "$draft" ]; then
              gh pr close "$draft" --repo "$DOCS_REPO" --delete-branch \
                --comment "Android agent $VERSION was released; its notes moved to a release PR. The next merged PR recreates this branch."
            else
              git push origin --delete "$DOCS_HEAD"
            fi
          else
            cp "$RUNNER_TEMP/leftover.mdx" "$file"
            git config user.name "newrelic-mobile-agent-bot"
            git config user.email "$BOT_EMAIL"
            git add "$DOCS_DIR/$DOCS_FILE_NAME"
            if git diff --staged --quiet; then
              echo "Nothing to prune: none of this release's bullets were on $DOCS_HEAD."
              exit 0
            fi
            git commit -m "chore: drop android-agent $VERSION bullets from next release notes"
            git push origin "HEAD:refs/heads/$DOCS_HEAD"
          fi
