name: Release notes tests

# CI for the shared release-notes code in .github/actions/release-notes/, which every adopted agent
# repo runs at @develop: the script suite, shellcheck, the action and workflow linters, and dry runs
# of the actions, by local path, on this repository's real history.

on:
  pull_request:
    paths:
      - ".github/actions/release-notes/**"
      - ".github/release-notes.json"
      - ".github/workflows/release-notes-*.yml"
      - "android-agent-next.mdx"

permissions:
  contents: write # the generate dry run calls POST /releases/generate-notes
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Script tests
        run: bash .github/actions/release-notes/test/run.sh
      - name: shellcheck
        run: shellcheck --severity=warning -x .github/actions/release-notes/scripts/*.sh .github/actions/release-notes/test/*.sh
      - name: Action run blocks
        run: bash .github/actions/release-notes/test/lint-actions.sh
      - name: actionlint
        run: |
          # Installer pinned to the commit of tag v1.7.7 (a tag can move), and the binary version pinned too.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/release-notes-*.yml

  dry-run:
    # A fork PR's token is read-only, and generate-notes needs contents: write.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate 7.8.3 (dry run)
        uses: ./.github/actions/release-notes/generate
        with:
          version: 7.8.3
          release-date: published
          dry-run: true
      - name: Check the 7.8.3 note
        run: |
          f="$RUNNER_TEMP/release-notes/out/android-783.mdx"
          grep -qx 'subject: Android agent' "$f"
          grep -qx "releaseDate: '2026-09-29'" "$f" # the publish date, looked up from the release
          grep -qx "downloadLink: 'https://central.sonatype.com/artifact/com.newrelic.agent.android/android-agent'" "$f"
          tail -1 "$f" | grep -q 'mobile-agents-eol-policy/#android-eol' # the Support statement ends it
          grep -q 'newrelic/newrelic-android-agent#635: release branch' "$RUNNER_TEMP/release-notes/pr-body.md"
      # A fixed PR number goes stale at the next release (#645 did with 7.8.4), so take the newest
      # merged PR into develop that has a release-note label and is in no release tag yet.
      - name: Find a merged, unreleased PR
        id: unreleased
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --base develop --state merged --limit 50 --json number,mergeCommit,labels \
            --jq '.[] | select(any(.labels[]; .name | startswith("release-note:"))) | "\(.number) \(.mergeCommit.oid)"' > "$RUNNER_TEMP/merged.txt"
          while read -r number sha; do
            if [ -z "$(git tag --contains "$sha")" ]; then
              echo "number=$number" >> "$GITHUB_OUTPUT"
              echo "Using #$number"
              exit 0
            fi
          done < "$RUNNER_TEMP/merged.txt"
          echo "::notice::No merged, labelled PR is waiting for a release (one just shipped); skipping the unreleased append dry run."
      - name: Append a merged, unreleased PR (dry run)
        if: steps.unreleased.outputs.number != ''
        uses: ./.github/actions/release-notes/append
        with:
          pr-number: ${{ steps.unreleased.outputs.number }}
          dry-run: true
      - name: Check the bullet for the unreleased PR
        if: steps.unreleased.outputs.number != ''
        env:
          NUMBER: ${{ steps.unreleased.outputs.number }}
        run: |
          grep -q "^appended #$NUMBER -> " "$RUNNER_TEMP/release-notes/status.txt"
      - name: Append a PR released in 7.8.3 (dry run, skipped)
        uses: ./.github/actions/release-notes/append
        with:
          pr-number: 634
          dry-run: true
      - name: Check that 634 was skipped as released
        run: |
          grep -qx 'skipped #634: already released in 7.8.3' "$RUNNER_TEMP/release-notes/status.txt"
