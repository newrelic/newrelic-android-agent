name: Android Smoke Test Workflows

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test-jdk11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: current
      - name: Stage with Gradle
        run: ./gradlew publish
      - name: Test with Gradle
        run: ./gradlew :plugins:gradle:functionalTests --tests "com.newrelic.agent.android.PluginJDK11SmokeSpec"
      - name: Upload build reports
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-jdk11-reports
          path: |
            build/reports/tests/test/index.html
            build/reports/tests/integrationTests/index.html
          if-no-files-found: ignore
          retention-days: 3

  smoke-test-jdk17:
    if: ${{ false }}  # disable for until JDK17 issues with tests are resolved
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: current
      - name: Stage with Gradle
        run: ./gradlew publish
      - name: Test with Gradle
        run: ./gradlew :plugins:gradle:functionalTests --tests "com.newrelic.agent.android.PluginJDK17SmokeSpec"
      - name: Upload build reports
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-jdk17-reports
          path: |
            build/reports/tests/test/index.html
            build/reports/tests/integrationTests/index.html
          if-no-files-found: ignore
          retention-days: 3

