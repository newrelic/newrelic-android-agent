name: Android Functional Test Workflows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-plugin-jdk17:
    if: ${{ false }}  # disable for until tests are resolved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          check-latest: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: current
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Stage with Gradle
        run: ./gradlew install publish
      - name: Build with Gradle
        run: ./gradlew :plugins:gradle:functionalTests
      - name: Upload build reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: plugins/gradle/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 5

  functional-plugin-jdk11:
    if: ${{ false }}  # disable for until tests are resolved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: current
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Stage with Gradle
        run: ./gradlew install publish
      - name: Build with Gradle
        id: test-step
        run: ./gradlew :plugins:gradle:functionalTests
      - name: Upload build reports
        # if: failure() && steps.test-step.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: plugins/gradle/build/reports/
          if-no-files-found: ignore
          retention-days: 5

  functional-regressions-jdk11:
    if: ${{ false }}  # disable for until tests are resolved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: current
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Stage with Gradle
        run: ./gradlew install publish
      - name: Build with Gradle
        id: test-step
        run: ./gradlew :plugins:gradle:functionalTests --tests "com.newrelic.agent.android.PluginRegressionSpec" -Pregressions
      - name: Upload build reports
        # if: failure() && steps.test-step.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: plugins/gradle/build/reports/
          if-no-files-found: ignore
          retention-days: 5

  functional-regressions-jdk17:
    if: ${{ false }}  # disable for until tests are resolved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          check-latest: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: current
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Stage with Gradle
        run: ./gradlew install publish
      - name: Build with Gradle
        run: ./gradlew :plugins:gradle:functionalTests --tests "com.newrelic.agent.android.PluginRegressionSpec" -Pregressions
      - name: Upload build reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: plugins/gradle/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 5
