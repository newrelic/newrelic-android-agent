        #       exit 1
        #     else
        #       echo "Artifacts were uploaded successfully to Central Sonatype."
        #       echo "Visit https://central.sonatype.com/publishing/deployments to view your artifacts."
        #     fi

  publish_mono_release:
     name: Publish Mono artifacts
     if: github.event_name != 'pull_request'
     environment: ${{ inputs.environment || ((github.ref_name == 'main' || github.ref_type == 'tag') && 'maven-central' || 'maven-snapshots') }}
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         with:
           ref: ${{ inputs.ref || github.sha }}
       - name: Setup JDK 17
         uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
         with:
           java-version: '17'
           distribution: 'temurin'
           cache: 'gradle'
       - name: Publish to sonatype and close the staging repo
         env:
           ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
           ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}
           ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
           ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
           ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
           VERSION_OVERRIDE: ${{ inputs.version }}
           TARGET_ENV: ${{ inputs.environment || ((github.ref_name == 'main' || github.ref_type == 'tag') && 'maven-central' || 'maven-snapshots') }}
         run: |
           if [ "$TARGET_ENV" = "maven-snapshots" ]; then
             # snapshot credentials must never stage a release version
             [ -n "$VERSION_OVERRIDE" ] || VERSION_OVERRIDE="$(grep '^newrelic\.agent\.version' gradle.properties | sed 's/.*=[[:space:]]*\([0-9][0-9.]*\).*/\1/')-SNAPSHOT"
             case "$VERSION_OVERRIDE" in
               *-SNAPSHOT) ;;
               *) echo "::error::maven-snapshots only publishes -SNAPSHOT versions (got '$VERSION_OVERRIDE')"; exit 1 ;;
             esac
           fi
           if [ -n "$VERSION_OVERRIDE" ]; then
             ./gradlew clean publishToSonatype closeSonatypeStagingRepository \
               --max-workers 1 -PmonoEnabled=true "-Pnewrelic.agent.version=$VERSION_OVERRIDE"
           else
             ./gradlew clean publishToSonatype closeSonatypeStagingRepository --max-workers 1 -PmonoEnabled=true
           fi
